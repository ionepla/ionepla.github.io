<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ionepla.com</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&display=swap" rel="stylesheet">
<style>
  /* Recreation of the original 2003 page. Change --purple to adjust the background. */
  :root { --purple: #837fab; --blue: #1a40c8; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--purple); font-family: "Nunito", "Arial Rounded MT Bold", "Varela Round", Arial, sans-serif; }
  .page { max-width: 604px; margin: 0 auto; }
  .page img { display: block; width: 100%; height: auto; margin: 0; }
  .greeting { background: #fff; padding: 1.1rem 1rem 1.2rem; text-align: center; color: var(--blue); font-weight: 800; font-size: clamp(1rem, 3.8vw, 1.2rem); line-height: 1.7; }
  .greeting p { margin: 0; }
  footer { text-align: center; color: #fff; font-family: Arial, Helvetica, sans-serif; font-size: 11px; padding: 1.25rem 1rem 2rem; }
</style>
</head>
<body>
  <div class="page">
    <img src="photo.jpg" width="604" height="453" alt="A smiling child with red hair, wrapped in a lavender scarf in the snow">
    <div class="greeting">
      <p lang="ca">Bones festes i feliç any nou!</p>
      <p lang="fr">Joyeuses fêtes et bonne année!</p>
      <p lang="en">Happy holidays and happy new year!</p>
      <p lang="es">¡Buenas fiestas y feliz año nuevo!</p>
    </div>
  </div>
  <footer>© 2003 ionepla.com</footer>
</body>
</html>
