<script>
/* HOW TO ADD A PHOTO
   1. Put the picture (JPEG, about 1300 px on the longest side) in the img/photo folder.
   2. Copy one line from the list below, paste it anywhere in the list, and change:
        id        the file name without ".jpg"
        category  one of the names in CATEGORIES
        place, year   the caption
        alt       a short description of the picture (for screen readers)
      Optional: add  d: "2025-07-14"  to set an exact date for the order within a year.
   The page measures each picture and sorts everything newest first by itself. */

const PHOTOS = [

  { id: "img_0293", category: "Water and coast", place: "Argentina", year: "2019", d: "2019-11-28", alt: "Wide waterfalls in a green valley under clouds" },

// Newest first: by year, then by the exact date when one is given
PHOTOS.sort((a, b) => (Number(b.year) || 0) - (Number(a.year) || 0) || (b.d || '').localeCompare(a.d || ''));

const gallery = document.getElementById('gallery');
const chips = document.getElementById('chips');
const lb = document.getElementById('lb');
const lbBody = document.getElementById('lbBody');
let active = 'All';

/* Reads a picture's width and height from the first bytes of the file (no need to type them). */
async function sizeOf(src) {
  try {
    const r = await fetch(src, { headers: { Range: 'bytes=0-16383' } });
    const b = new Uint8Array(await r.arrayBuffer());
    let i = 2;
    while (i + 9 < b.length) {
      if (b[i] !== 0xFF) { i++; continue; }
      const m = b[i + 1];
      if (m >= 0xC0 && m <= 0xCF && m !== 0xC4 && m !== 0xC8 && m !== 0xCC)
        return { w: (b[i + 7] << 8) | b[i + 8], h: (b[i + 5] << 8) | b[i + 6] };
      i += 2 + ((b[i + 2] << 8) | b[i + 3]);
    }
  } catch (e) { /* fall through */ }
  return new Promise(res => {
    const im = new Image();
    im.onload = () => res({ w: im.naturalWidth, h: im.naturalHeight });
    im.onerror = () => res({ w: 4, h: 3 });
    im.src = src;
  });
}

function img(p, full) {
  const i = document.createElement('img');
  i.src = '/img/photo/' + p.id + '.jpg';
  i.alt = p.alt; i.draggable = false;
  if (!full) { i.loading = 'lazy'; i.width = p.w; i.height = p.h; i.style.aspectRatio = p.w + ' / ' + p.h; }
  i.addEventListener('contextmenu', e => e.preventDefault());
  return i;
}
function caption(p, el) {
  const meta = [p.place, p.year].filter(Boolean).join(', ');
  if (!meta) return null;
  el.innerHTML = '<div class="m"></div>';
  el.querySelector('.m').textContent = meta;
  return el;
}
// Three columns (two on tablets, one on phones). Photos are placed in date order:
// each next photo goes into the shortest column, so the order reads from top to bottom.
function columnsCount() { const w = window.innerWidth; return w >= 900 ? 3 : (w >= 560 ? 2 : 1); }
function render() {
  gallery.innerHTML = '';
  const n = columnsCount();
  const cols = Array.from({ length: n }, () => { const c = document.createElement('div'); c.className = 'col'; gallery.appendChild(c); return c; });
  const heights = new Array(n).fill(0);
  PHOTOS.filter(p => active === 'All' || p.category === active).forEach(p => {
    const k = heights.indexOf(Math.min(...heights));
    const f = document.createElement('figure'); f.className = 'piece'; f.style.margin = '0 0 1.5rem';
    const b = document.createElement('button'); b.type = 'button';
    b.setAttribute('aria-label', 'View photograph: ' + p.alt);
    b.appendChild(img(p, false)); b.addEventListener('click', () => openPhoto(p));
    f.appendChild(b);
    const c = caption(p, document.createElement('figcaption')); if (c) f.appendChild(c);
    cols[k].appendChild(f);
    heights[k] += p.h / p.w + 0.16;     // photo height plus room for the caption
  });
}
function openPhoto(p) {
  lbBody.innerHTML = ''; lbBody.appendChild(img(p, true));
  const cap = caption(p, document.createElement('div'));
  if (cap) { cap.className = 'cap'; lbBody.appendChild(cap); }
  lb.showModal();
}
document.getElementById('lbClose').addEventListener('click', () => lb.close());
lb.addEventListener('click', e => { if (e.target === lb) lb.close(); });
['All', ...CATEGORIES].forEach(c => {
  const b = document.createElement('button');
  b.className = 'chip'; b.type = 'button'; b.textContent = c;
  b.setAttribute('aria-pressed', c === active);
  b.addEventListener('click', () => {
    active = c;
    chips.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x.textContent === c));
    render();
  });
  chips.appendChild(b);
});
let lastCols = columnsCount();
window.addEventListener('resize', () => { const n = columnsCount(); if (n !== lastCols) { lastCols = n; render(); } });
Promise.all(PHOTOS.map(async p => Object.assign(p, await sizeOf('/img/photo/' + p.id + '.jpg')))).then(render);
document.getElementById('yr').textContent = new Date().getFullYear();
</script>
